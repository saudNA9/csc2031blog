<!-- This is the 404.html file, displayed when a requested page is not found. -->
<!-- I included a friendly message and a button to return to the homepage. -->
{% extends "base.html" %}

{% block content %}
<div class="container text-center mt-5">
    <h1 class="display-4 text-danger">404 - Not Found</h1>
    <p class="lead">The page you are looking for could not be found. Please check the URL or return to the homepage.</p>
    <a href="/" class="btn btn-primary">Return to Home</a>
</div>
{% endblock %}
