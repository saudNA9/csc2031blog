<!-- This is the 501.html file, displayed when a request method is not implemented. -->
<!-- I included a clear message and a navigation option back to the homepage. -->
{% extends "base.html" %}

{% block content %}
<div class="container text-center mt-5">
    <h1 class="display-4 text-danger">501 - Not Implemented</h1>
    <p class="lead">The server does not recognize the request method or it is not capable of fulfilling it.</p>
    <a href="/" class="btn btn-primary">Return to Home</a>
</div>
{% endblock %}
