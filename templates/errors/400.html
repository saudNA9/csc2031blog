<!-- This is the 400.html error page template for handling Bad Request errors. -->
<!-- I did design a user-friendly error page with a clear message and a return to home button. -->
{% extends "base.html" %}

{% block content %}
<div class="container text-center mt-5">
    <h1 class="display-4 text-danger">400 - Bad Request</h1>
    <p class="lead">The request sent by the client was invalid or could not be understood by the server.</p>
    <a href="/" class="btn btn-primary">Return to Home</a>
</div>
{% endblock %}
