<!-- This is the rate_limit.html file, displayed when login attempts exceeds the limit. -->
<!-- I added a notification and an option to retry later or return to the homepage. -->
{% extends "base.html" %}

{% block content %}
<div class="container text-center mt-5">
    <h1 class="display-4 text-danger">Rate Limit Exceeded</h1>
    <p class="lead">You have exceeded the number of allowed login attempts. Please try again later.</p>
    <a href="/" class="btn btn-primary">Return to Home</a>
</div>
{% endblock %}
