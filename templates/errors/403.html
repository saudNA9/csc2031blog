<!-- This is the 403.html file, displayed when access to a page is forbidden. -->
<!-- I provided navigation options for users to recover from the error. -->
{% extends "base.html" %}

{% block content %}
    <div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="text-center">
            <h1 class="text-danger display-1">403 Forbidden</h1>
            <p class="text-muted h4">You are not authorized to access this page.</p>
            <div class="mt-4">
                <a href="javascript:history.back()" class="btn btn-lg btn-primary me-3">Go Back</a>
                <a href="{{ url_for('index') }}" class="btn btn-lg btn-success">Go Home</a>
            </div>
        </div>
    </div>
{% endblock %}
